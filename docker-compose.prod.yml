# ─── docker-compose.prod.yml — Entorno de PRODUCCIÓN (VPS / servidor propio) ──
# Uso: docker compose -f docker-compose.prod.yml up -d --build
#
# Este archivo NO levanta postgres — usa la base de datos externa (Railway, RDS, etc.)
# DATABASE_URL en .env.production debe apuntar al servidor de BD externo.
#
# Primera vez:
#   1. Crear .env.production a partir de .env.example con los valores reales
#   2. docker compose -f docker-compose.prod.yml up -d --build

name: biotrack-prod

services:
  # ─── API (imagen compilada, stage runner — sin devDeps, sin tsx) ────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: biotrack_api_prod
    restart: always
    env_file:
      - .env.production          # Variables de producción (nunca commitear este archivo)
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - uploads_prod:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

volumes:
  uploads_prod:

networks:
  default:
    name: biotrack_prod_network
